name: Python Code Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Matches the standard versions, including 3.14 for your latest projects
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # Creates a .venv and installs exact versions from uv.lock
          # Fails the pipeline if uv.lock is out of sync with pyproject.toml
          uv sync --frozen

      - name: Check code styling and formatting (Ruff)
        run: |
          uv run ruff format --check .

      - name: Lint code (Ruff)
        run: |
          uv run ruff check --output-format=github .

      - name: Type checking (Mypy)
        run: |
          uv run mypy . --strict
